{% extends "core/base.html" %}

{% block page_title %}Delete task{% endblock %}
{% block page_subtitle %}This action cannot be undone{% endblock %}
{% block page_content %}
  <div class="panel confirm-card" style="max-width: 560px; margin: 0 auto;">
    <div class="panel-body">
      <div class="confirm-icon"><i class="bi bi-check2-square"></i></div>
      <h3 class="confirm-title">Delete task '{{ task.title }}'?</h3>
      <p class="confirm-text">The task will be permanently removed.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger-soft">Yes, delete task</button>
        <a href="{% url 'task_list' %}" class="btn btn-light-purple ms-2">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
